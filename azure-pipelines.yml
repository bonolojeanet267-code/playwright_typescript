trigger:
  branches:
    include:
      - main
      - master

pr:
  branches:
    include:
      - main
      - master

pool:
  vmImage: windows-latest

variables:
  NODE_VERSION: '20.x'
  PLAYWRIGHT_BROWSERS_PATH: '$(Pipeline.Workspace)/.playwright'

steps:
  - task: NodeTool@0
    displayName: Use Node.js $(NODE_VERSION)
    inputs:
      versionSpec: $(NODE_VERSION)

  - script: npm ci
    displayName: Install dependencies

  - script: npx playwright install --with-deps chromium firefox webkit
    displayName: Install Playwright browsers

  - script: npm test
    displayName: Run Playwright UI and API tests
    env:
      CI: 'true'
      SAUCE_USERNAME: $(SAUCE_USERNAME)
      SAUCE_PASSWORD: $(SAUCE_PASSWORD)

  - task: PublishTestResults@2
    displayName: Publish Playwright test results
    condition: always()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: 'test-results/playwright-junit.xml'
      searchFolder: '$(System.DefaultWorkingDirectory)'
      mergeTestResults: true
      failTaskOnFailedTests: true
      testRunTitle: 'SauceDemo Playwright tests'

  - task: PublishPipelineArtifact@1
    displayName: Publish Playwright HTML report
    condition: always()
    inputs:
      targetPath: 'playwright-report'
      artifact: playwright-report
      publishLocation: pipeline

  - task: PowerShell@2
    displayName: Create Azure DevOps bugs for failed tests
    condition: failed('Run Playwright UI and API tests')
    inputs:
      filePath: scripts/create-azure-bugs.ps1
    env:
      AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)
      FAILED_TEST_RESULTS: '$(System.DefaultWorkingDirectory)/test-results/playwright-junit.xml'
