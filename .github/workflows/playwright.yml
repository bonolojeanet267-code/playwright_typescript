name: Playwright Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  ui-test:
    strategy:
      matrix:
        browser: ["chromium", "firefox", "webkit"]
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
      SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD }}
      XRAY_CLIENT_ID: ${{ secrets.XRAY_CLIENT_ID }}
      XRAY_CLIENT_SECRET: ${{ secrets.XRAY_CLIENT_SECRET }}
      XRAY_PROJECT_KEY: ${{ secrets.XRAY_PROJECT_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run Playwright UI tests
        run: npx playwright test --project="${{ matrix.browser }}"

      - name: Import results to Xray
        if: always()
        run: |
          if [ -f "test-results/playwright-junit.xml" ]; then
            curl -f --location --request POST "https://xray.cloud.getxray.app/api/v2/import/execution/junit" \
              --user "$XRAY_CLIENT_ID:$XRAY_CLIENT_SECRET" \
              -F "file=@test-results/playwright-junit.xml" \
              -F "projectKey=$XRAY_PROJECT_KEY"
          else
            echo "No JUnit file available for Xray import."
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 3

  api-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
      SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD }}
      XRAY_CLIENT_ID: ${{ secrets.XRAY_CLIENT_ID }}
      XRAY_CLIENT_SECRET: ${{ secrets.XRAY_CLIENT_SECRET }}
      XRAY_PROJECT_KEY: ${{ secrets.XRAY_PROJECT_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright API tests
        run: npx playwright test --project=api

      - name: Import results to Xray
        if: always()
        run: |
          if [ -f "test-results/playwright-junit.xml" ]; then
            curl -f --location --request POST "https://xray.cloud.getxray.app/api/v2/import/execution/junit" \
              --user "$XRAY_CLIENT_ID:$XRAY_CLIENT_SECRET" \
              -F "file=@test-results/playwright-junit.xml" \
              -F "projectKey=$XRAY_PROJECT_KEY"
          else
            echo "No JUnit file available for Xray import."
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-api
          path: playwright-report/
          retention-days: 3
