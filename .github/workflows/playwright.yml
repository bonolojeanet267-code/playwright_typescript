name: Playwright Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ui-test:
    timeout-minutes: 20
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright UI tests
        run: npx playwright test --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-chromium
          path: |
            playwright-report/
            test-results/
          retention-days: 3

      - name: Debug JUnit file
        if: always()
        shell: pwsh
        run: |
          $junitFile = Join-Path $env:GITHUB_WORKSPACE 'test-results/playwright-junit.xml'

          Write-Host "Looking for JUnit file:"
          Write-Host $junitFile

          if (Test-Path -LiteralPath $junitFile) {
            Write-Host "JUnit file exists."

            $fileInfo = Get-Item -LiteralPath $junitFile

            Write-Host "File size: $($fileInfo.Length) bytes"

            Write-Host "--- JUnit XML content ---"
            Get-Content -LiteralPath $junitFile -Raw
          }
          else {
            Write-Host "JUnit file does NOT exist."

            Write-Host "--- Contents of test-results ---"

            if (Test-Path -LiteralPath 'test-results') {
              Get-ChildItem -Recurse 'test-results'
            }
            else {
              Write-Host "test-results folder does not exist."
            }
          }

      - name: Import UI results into Xray
        if: always()
        shell: pwsh
        env:
          XRAY_CLIENT_ID: ${{ secrets.XRAY_CLIENT_ID }}
          XRAY_CLIENT_SECRET: ${{ secrets.XRAY_CLIENT_SECRET }}
          XRAY_PROJECT_KEY: ${{ secrets.XRAY_PROJECT_KEY }}
        run: |
          $junitFile = Join-Path $env:GITHUB_WORKSPACE 'test-results/playwright-junit.xml'

          Write-Host "JUnit file path:"
          Write-Host $junitFile

          # Check Xray secrets
          if (
            [string]::IsNullOrWhiteSpace($env:XRAY_CLIENT_ID) -or
            [string]::IsNullOrWhiteSpace($env:XRAY_CLIENT_SECRET) -or
            [string]::IsNullOrWhiteSpace($env:XRAY_PROJECT_KEY)
          ) {
            Write-Host 'Xray credentials or project key are not configured; skipping import.'
            exit 0
          }

          # Check JUnit file exists
          if (-not (Test-Path -LiteralPath $junitFile)) {
            Write-Warning "JUnit report was not found at $junitFile; skipping Xray import."
            exit 0
          }

          # Check JUnit file is not empty
          $fileInfo = Get-Item -LiteralPath $junitFile

          if ($fileInfo.Length -eq 0) {
            Write-Warning "JUnit report is empty; skipping Xray import."
            exit 0
          }

          Write-Host "JUnit file found."
          Write-Host "JUnit file size: $($fileInfo.Length) bytes"

          # Validate XML
          try {
            [xml]$junit = Get-Content -LiteralPath $junitFile -Raw
          }
          catch {
            throw "JUnit report is not valid XML: $($_.Exception.Message)"
          }

          # Check test cases
          $testCases = @($junit.SelectNodes('//testcase'))

          if ($testCases.Count -eq 0) {
            throw "JUnit report contains no testcase elements: $junitFile"
          }

          Write-Host "Found $($testCases.Count) test cases in JUnit report."

          # Authenticate with Xray
          Write-Host "Authenticating with Xray..."

          $authResponse = Invoke-RestMethod `
            -Method Post `
            -Uri 'https://xray.cloud.getxray.app/api/v2/authenticate' `
            -ContentType 'application/json' `
            -Body (@{
              client_id = $env:XRAY_CLIENT_ID
              client_secret = $env:XRAY_CLIENT_SECRET
            } | ConvertTo-Json)

          $token = if ($authResponse -is [string]) {
            $authResponse.Trim('"')
          }
          else {
            $authResponse.token
          }

          if ([string]::IsNullOrWhiteSpace($token)) {
            throw 'Xray authentication succeeded but no token was returned.'
          }

          Write-Host "Xray authentication successful."

          # Xray JUnit import URL
          $importUri =
            "https://xray.cloud.getxray.app/api/v2/import/execution/junit" +
            "?projectKey=$([uri]::EscapeDataString($env:XRAY_PROJECT_KEY))"

          Write-Host "Xray import URL:"
          Write-Host $importUri

          Write-Host "Importing JUnit results into Xray..."

          # Read the XML
          $junitContent = Get-Content -LiteralPath $junitFile -Raw

          # Authorization header
          $headers = @{
            Authorization = "Bearer $token"
          }

          try {
            $response = Invoke-RestMethod `
              -Method Post `
              -Uri $importUri `
              -Headers $headers `
              -ContentType 'text/xml' `
              -Body $junitContent

            Write-Host "Xray import successful."

            Write-Host "Xray response:"
            $response | ConvertTo-Json -Depth 10
          }
          catch {
            Write-Host "Xray import failed."

            if ($_.ErrorDetails.Message) {
              Write-Host "Xray error response:"
              Write-Host $_.ErrorDetails.Message
            }

            throw
          }


  api-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright API tests
        run: npx playwright test --project=api

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-api
          path: |
            playwright-report/
            test-results/
          retention-days: 3