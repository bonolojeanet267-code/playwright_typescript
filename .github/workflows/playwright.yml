name: Playwright Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ui-test:
    timeout-minutes: 20
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright UI tests
        run: npx playwright test --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-chromium
          path: |
            playwright-report/
            test-results/
          retention-days: 3

      - name: Debug junit file
        if: always()
        shell: pwsh
        run: |
          if (Test-Path 'test-results/playwright-junit.xml') {
            Write-Host "File exists. Size in bytes:"
            (Get-Item 'test-results/playwright-junit.xml').Length
            Write-Host "--- Content ---"
            Get-Content 'test-results/playwright-junit.xml' -Raw
          } else {
            Write-Host "File does NOT exist at that path"
            Write-Host "Contents of test-results folder:"
            Get-ChildItem -Recurse test-results -ErrorAction SilentlyContinue
          }

      - name: Import UI results into Xray
        if: always()
        shell: pwsh
        env:
          XRAY_CLIENT_ID: ${{ secrets.XRAY_CLIENT_ID }}
          XRAY_CLIENT_SECRET: ${{ secrets.XRAY_CLIENT_SECRET }}
          XRAY_PROJECT_KEY: ${{ secrets.XRAY_PROJECT_KEY }}
        run: |
          $junitFile = Join-Path $env:GITHUB_WORKSPACE 'test-results/playwright-junit.xml'

          if ([string]::IsNullOrWhiteSpace($env:XRAY_CLIENT_ID) -or
              [string]::IsNullOrWhiteSpace($env:XRAY_CLIENT_SECRET) -or
              [string]::IsNullOrWhiteSpace($env:XRAY_PROJECT_KEY)) {
            Write-Host 'Xray credentials or project key are not configured; skipping import.'
            exit 0
          }

          if (-not (Test-Path $junitFile)) {
            Write-Warning "JUnit report was not found at $junitFile; skipping Xray import."
            exit 0
          }

          if ((Get-Item $junitFile).Length -eq 0) {
            Write-Warning "JUnit report is empty; skipping Xray import."
            exit 0
          }

          try {
            [xml]$junit = Get-Content -Path $junitFile -Raw
          }
          catch {
            throw "JUnit report is not valid XML: $($_.Exception.Message)"
          }

          if (-not $junit.testsuites -and -not $junit.testsuite) {
            throw 'JUnit report does not contain a testsuite or testsuites element.'
          }

          $authResponse = Invoke-RestMethod `
            -Method Post `
            -Uri 'https://xray.cloud.getxray.app/api/v2/authenticate' `
            -ContentType 'application/json' `
            -Body (@{
              client_id = $env:XRAY_CLIENT_ID
              client_secret = $env:XRAY_CLIENT_SECRET
            } | ConvertTo-Json)

          $token = if ($authResponse -is [string]) {
            $authResponse.Trim('"')
          } else {
            $authResponse.token
          }

          if ([string]::IsNullOrWhiteSpace($token)) {
            throw 'Xray authentication succeeded but no token was returned.'
          }

          $importUri = "https://xray.cloud.getxray.app/api/v2/import/execution/junit?projectKey=$([uri]::EscapeDataString($env:XRAY_PROJECT_KEY))"

          & curl.exe --fail-with-body --silent --show-error `
            --request POST `
            --header "Authorization: Bearer $token" `
            --form "file=@$junitFile;type=application/xml" `
            --url $importUri

          if ($LASTEXITCODE -ne 0) {
            throw "Xray JUnit import failed with exit code $LASTEXITCODE."
          }
  api-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright API tests
        run: npx playwright test --project=api

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-api
          path: |
            playwright-report/
            test-results/
          retention-days: 3
