name: Playwright Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  ui-test:
    strategy:
      matrix:
        browser: ["chromium", "firefox", "webkit"]
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
      SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD }}
      XRAY_CLIENT_ID: ${{ secrets.XRAY_CLIENT_ID }}
      XRAY_CLIENT_SECRET: ${{ secrets.XRAY_CLIENT_SECRET }}
      XRAY_PROJECT_KEY: ${{ secrets.XRAY_PROJECT_KEY }}
      XRAY_TEST_PLAN_NAME: "Playwright UI test plan"
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      XRAY_TEST_PLAN_KEY: ${{ secrets.XRAY_TEST_PLAN_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Create or reuse Xray test plan
        if: always()
        shell: bash
        run: |
          if [ -n "$XRAY_TEST_PLAN_KEY" ]; then
            echo "Reusing existing Xray test plan: $XRAY_TEST_PLAN_KEY"
            echo "XRAY_TEST_PLAN_KEY=$XRAY_TEST_PLAN_KEY" >> "$GITHUB_ENV"
            exit 0
          fi

          if [ -z "$JIRA_BASE_URL" ] || [ -z "$JIRA_EMAIL" ] || [ -z "$JIRA_API_TOKEN" ]; then
            echo "Jira credentials are not configured. Skipping Xray test plan creation."
            exit 0
          fi

          response=$(curl -sS -X POST \
            -u "$JIRA_EMAIL:$JIRA_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"fields\":{\"project\":{\"key\":\"$XRAY_PROJECT_KEY\"},\"summary\":\"$XRAY_TEST_PLAN_NAME - run $GITHUB_RUN_NUMBER\",\"issuetype\":{\"name\":\"Test Plan\"}}}" \
            "$JIRA_BASE_URL/rest/api/3/issue")

          key=$(echo "$response" | python -c "import sys, json; print(json.load(sys.stdin).get('key',''))")

          if [ -z "$key" ]; then
            echo "Failed to create the Jira/Xray Test Plan. Response: $response"
            exit 1
          fi

          echo "Created Xray test plan: $key"
          echo "XRAY_TEST_PLAN_KEY=$key" >> "$GITHUB_ENV"

      - name: Run Playwright UI tests
        run: npx playwright test --project="${{ matrix.browser }}"

      - name: Import results to Xray and attach to the test plan
        if: always()
        run: |
          if [ -f "test-results/playwright-junit.xml" ]; then
            curl -f --location --request POST "https://xray.cloud.getxray.app/api/v2/import/execution/junit" \
              --user "$XRAY_CLIENT_ID:$XRAY_CLIENT_SECRET" \
              -F "file=@test-results/playwright-junit.xml" \
              -F "projectKey=$XRAY_PROJECT_KEY" \
              -F "testPlanKey=${XRAY_TEST_PLAN_KEY:-}"
          else
            echo "No JUnit file available for Xray import."
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 3

  api-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
      SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD }}
      XRAY_CLIENT_ID: ${{ secrets.XRAY_CLIENT_ID }}
      XRAY_CLIENT_SECRET: ${{ secrets.XRAY_CLIENT_SECRET }}
      XRAY_PROJECT_KEY: ${{ secrets.XRAY_PROJECT_KEY }}
      XRAY_TEST_PLAN_NAME: "Playwright API test plan"
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      XRAY_TEST_PLAN_KEY: ${{ secrets.XRAY_TEST_PLAN_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Create or reuse Xray test plan
        if: always()
        shell: bash
        run: |
          if [ -n "$XRAY_TEST_PLAN_KEY" ]; then
            echo "Reusing existing Xray test plan: $XRAY_TEST_PLAN_KEY"
            echo "XRAY_TEST_PLAN_KEY=$XRAY_TEST_PLAN_KEY" >> "$GITHUB_ENV"
            exit 0
          fi

          if [ -z "$JIRA_BASE_URL" ] || [ -z "$JIRA_EMAIL" ] || [ -z "$JIRA_API_TOKEN" ]; then
            echo "Jira credentials are not configured. Skipping Xray test plan creation."
            exit 0
          fi

          response=$(curl -sS -X POST \
            -u "$JIRA_EMAIL:$JIRA_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"fields\":{\"project\":{\"key\":\"$XRAY_PROJECT_KEY\"},\"summary\":\"$XRAY_TEST_PLAN_NAME - run $GITHUB_RUN_NUMBER\",\"issuetype\":{\"name\":\"Test Plan\"}}}" \
            "$JIRA_BASE_URL/rest/api/3/issue")

          key=$(echo "$response" | python -c "import sys, json; print(json.load(sys.stdin).get('key',''))")

          if [ -z "$key" ]; then
            echo "Failed to create the Jira/Xray Test Plan. Response: $response"
            exit 1
          fi

          echo "Created Xray test plan: $key"
          echo "XRAY_TEST_PLAN_KEY=$key" >> "$GITHUB_ENV"

      - name: Run Playwright API tests
        run: npx playwright test --project=api

      - name: Import results to Xray and attach to the test plan
        if: always()
        run: |
          if [ -f "test-results/playwright-junit.xml" ]; then
            curl -f --location --request POST "https://xray.cloud.getxray.app/api/v2/import/execution/junit" \
              --user "$XRAY_CLIENT_ID:$XRAY_CLIENT_SECRET" \
              -F "file=@test-results/playwright-junit.xml" \
              -F "projectKey=$XRAY_PROJECT_KEY" \
              -F "testPlanKey=${XRAY_TEST_PLAN_KEY:-}"
          else
            echo "No JUnit file available for Xray import."
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-api
          path: playwright-report/
          retention-days: 3
